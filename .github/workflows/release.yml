name: Release

on:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  # After each merge: open or update the release PR (branch release/next).
  # Uses the RELEASE_TOKEN PAT so CI runs on the release PR (GITHUB_TOKEN pushes trigger no workflows).
  release-pr:
    if: "${{ !startsWith(github.event.head_commit.message, 'chore(release): v') }}"
    runs-on: ubuntu-latest
    concurrency:
      group: release-pr
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          token: ${{ secrets.RELEASE_TOKEN }}
      - name: Update release PR
        run: python3 scripts/release.py prepare
        env:
          GH_TOKEN: ${{ secrets.RELEASE_TOKEN }}

  # The release PR was merged: build the app, tag the commit, publish the GitHub Release.
  publish:
    if: "${{ startsWith(github.event.head_commit.message, 'chore(release): v') }}"
    runs-on: macos-26
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Release notes
        id: notes
        run: echo "tag=v$(python3 scripts/release.py publish-notes "$GITHUB_SHA" notes.md)" >> "$GITHUB_OUTPUT"
      - name: Build app
        run: |
          scripts/bundle.sh
          scripts/package.sh "$TAG"
        env:
          TAG: ${{ steps.notes.outputs.tag }}
      - name: Tag and publish
        run: |
          if ! git rev-parse -q --verify "refs/tags/$TAG" >/dev/null; then
            git tag "$TAG" "$GITHUB_SHA"
            git push origin "$TAG"
          fi
          assets=("build/JeanNotch-$TAG.zip" "build/JeanNotch-$TAG.pkg")
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release edit "$TAG" --notes-file notes.md
            gh release upload "$TAG" "${assets[@]}" --clobber
          else
            gh release create "$TAG" "${assets[@]}" --title "JeanNotch $TAG" --notes-file notes.md --verify-tag
          fi
        env:
          TAG: ${{ steps.notes.outputs.tag }}
      # RELEASE_TOKEN must also cover NeilujD/homebrew-tap (scripts/setup-release-token.sh).
      - name: Update Homebrew cask
        run: |
          sha=$(shasum -a 256 "build/JeanNotch-$TAG.zip" | cut -d' ' -f1)
          git clone --depth 1 "https://x-access-token:$TAP_TOKEN@github.com/NeilujD/homebrew-tap.git" tap
          mkdir -p tap/Casks
          sed -e "s/@VERSION@/${TAG#v}/" -e "s/@SHA256@/$sha/" packaging/jean-notch.rb > tap/Casks/jean-notch.rb
          cd tap
          git add Casks/jean-notch.rb
          if ! git diff --cached --quiet; then
            git -c user.name="github-actions[bot]" -c user.email="41898282+github-actions[bot]@users.noreply.github.com" \
              commit -m "jean-notch ${TAG#v}"
            git push
          fi
        env:
          TAG: ${{ steps.notes.outputs.tag }}
          TAP_TOKEN: ${{ secrets.RELEASE_TOKEN }}
