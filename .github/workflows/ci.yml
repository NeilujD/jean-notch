name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  build-and-test:
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v7
      - name: Swift version
        run: swift --version
      - name: Build
        run: swift build
      - name: Test
        run: swift test

  release-script:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Test release script
        run: python3 -m unittest discover -s scripts -p 'test_*.py' -v
